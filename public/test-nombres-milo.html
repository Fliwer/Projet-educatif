<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Écouter les nombres de Milo</title>
<style>body{margin:0;background:#eee9fc;color:#17203a;font:20px Arial,sans-serif;line-height:1.6}main{max-width:900px;margin:35px auto;padding:25px}h1{font-size:36px}label{display:block}input,button{font:inherit;padding:14px;border:1px solid #b8add9;border-radius:14px;background:white;color:#17203a}input{max-width:200px}#nombres{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}button{min-width:85px;cursor:pointer}button[aria-pressed=true]{background:#5543a8;color:white}#etat{min-height:3em}a{color:#5543a8}</style></head>
<body><main><h1>Écoutons les nombres de Milo</h1><p>Touche un nombre pour écouter son enregistrement. Note ceux dont la prononciation semble étrange.</p><label>Code du profil <input id="code" maxlength="6" value="LUMO01" autocomplete="off"></label><div id="nombres"></div><p id="etat" role="status" aria-live="polite"></p><p><a href="/">Retour au jeu</a></p></main><script type="module" src="/test-nombres-milo.js"></script></body></html>
