<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les aventures de Milo · Lumo</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1120px;margin:auto;padding:24px 18px}h1{text-align:center;color:#7054a8;margin:12px 0}.intro{text-align:center;margin:12px 0 24px}.galerie{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.illustration{background:#fff;border:2px solid #e5ddef;border-radius:26px;padding:16px;text-align:center;box-shadow:0 6px 0 #e5ddef}.illustration h2{font-size:22px;color:#7054a8;margin:12px 0}.illustration .scene{height:260px;margin:0}.illustration .scene svg{height:100%;width:100%}.illustration p{min-height:44px;margin:12px 0}.illustration .btn{width:100%;font-size:15px}.apercu-pied{text-align:center;margin:24px 0}.btn:disabled{opacity:.55;cursor:default}@media(max-width:740px){.galerie{grid-template-columns:1fr}.illustration .scene{height:260px}}</style></head><body><main><h1>Les aventures de Milo</h1><p class="intro">Aperçu des illustrations · aucune réponse ni progression enregistrée.</p><div class="galerie" id="galerie"></div><p class="apercu-pied"><button class="lien" id="recommencer">Recommencer les scènes</button> · <a href="/">Retour au jeu</a></p></main><script type="module" src="/apercu-illustrations.js"></script></body></html>
